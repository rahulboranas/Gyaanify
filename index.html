<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyaanify - Hinglish Kitaab Kranti</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nothing': ['"DotGothic16"', 'sans-serif'],
                        'sans': ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<!-- ✅ No scroll, full fit -->
<body class="h-screen w-full relative overflow-hidden font-sans text-white bg-black">

    <!-- Background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="famous.png" alt="Famous Books Background" class="w-full h-full object-cover opacity-80">
        <div class="absolute inset-0 bg-gradient-to-b from-black/90 via-black/70 to-black/90"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col items-center justify-center h-screen px-4 py-6 text-center">

        <p class="font-nothing text-xs md:text-xl text-neutral-400 mb-3 uppercase tracking-[0.3em]">
            Tayari chal rahi hai...
        </p>
        
        <h1 class="font-nothing text-3xl md:text-6xl font-black mb-6 uppercase leading-snug tracking-[0.15em] md:tracking-[0.3em]">
            <span class="text-orange-400">Hinglish</span> <span class="text-white">Kitaab</span>
            <br/> 
            <span class="text-blue-400">Kranti</span> <span class="text-white">Shuru</span>
        </h1>

        <!-- Countdown -->
        <div class="grid grid-cols-4 gap-2 md:gap-6 font-nothing uppercase mb-6 w-full max-w-md">
            
            <div class="bg-black/70 border border-neutral-600 rounded-lg p-3 backdrop-blur-md">
                <span id="days" class="text-2xl md:text-5xl font-bold">00</span>
                <span class="block text-[10px] md:text-sm mt-1 text-neutral-400">Din</span>
            </div>
            
            <div class="bg-black/70 border border-neutral-600 rounded-lg p-3 backdrop-blur-md">
                <span id="hours" class="text-2xl md:text-5xl font-bold">00</span>
                <span class="block text-[10px] md:text-sm mt-1 text-neutral-400">Ghante</span>
            </div>
            
            <div class="bg-black/70 border border-neutral-600 rounded-lg p-3 backdrop-blur-md">
                <span id="minutes" class="text-2xl md:text-5xl font-bold">00</span>
                <span class="block text-[10px] md:text-sm mt-1 text-neutral-400">Min</span>
            </div>
            
            <div class="bg-black/70 border border-neutral-600 rounded-lg p-3 backdrop-blur-md">
                <span id="seconds" class="text-2xl md:text-5xl font-bold text-blue-400">00</span>
                <span class="block text-[10px] md:text-sm mt-1 text-neutral-400">Sec</span>
            </div>
        </div>

        <!-- Message -->
        <div class="max-w-sm bg-black/70 border border-neutral-700 rounded-full px-4 py-2 backdrop-blur-lg">
            <p class="text-xs md:text-base text-neutral-200 leading-snug">
                Hum aa rhe hai jaldi... bas trust aur pyaar chahiye 😉❤️
            </p>
        </div>

    </div>

    <!-- Countdown Script -->
    <script>
        const countDownDate = new Date("May 28, 2026 00:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = 
                    "<h2 class='font-nothing text-3xl md:text-5xl font-bold text-orange-400 uppercase tracking-[0.3em]'>Abhi Live hain!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
